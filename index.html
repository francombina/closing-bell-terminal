<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Closing Bell Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
      padding: 10px 15px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .centered-title {
      font-size: 22px;
      font-weight: bold;
    }

    /* Botón compacto solo con icono de Chromecast */
    .btn-cast-icon {
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .btn-cast-icon:hover {
      background-color: #222222;
      border-color: #2962ff;
      color: #2962ff;
    }

    .btn-cast-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Contenedor del Ticker */
    #ticker-container {
      width: 100%;
      height: 50px;
      margin-bottom: 15px;
    }

    /* Grid layout para las 2 columnas */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 850px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
      .header-container {
        flex-direction: row;
      }
    }

    /* Video responsive */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background-color: #111;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Chart Container */
    .chart-wrapper {
      height: 400px;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    #tradingview_chart {
      height: 100%;
      width: 100%;
    }
  </style>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div class="header-container">
    <div class="centered-title">🔔 Monitor Closing Bell Advisors</div>
    
    <!-- Botón compacto solo con icono -->
    <button class="btn-cast-icon" onclick="transmitirPestana()" title="Transmitir Pestaña a TV">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c3.31 0 6 2.69 6 6h2c0-4.42-3.58-8-8-8zm0-4v2c5.52 0 10 4.48 10 10h2c0-6.63-5.37-12-12-12zm21-2H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
      </svg>
    </button>
  </div>

  <!-- Ticker Tape Widget Container -->
  <div id="ticker-container"></div>

  <!-- Main Content Grid -->
  <div class="grid-container">
    <!-- Columna 1: Video YouTube -->
    <div class="video-wrapper">
      <iframe id="youtube-frame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Columna 2: Gráfico TradingView -->
    <div class="chart-wrapper">
      <div id="tradingview_chart"></div>
    </div>
  </div>

  <script>
    function transmitirPestana() {
      // Inicia el selector de menú de Chrome para elegir pantalla o pestaña hacia el TV
      if (window.chrome && chrome.cast) {
        chrome.cast.requestSession(() => {}, () => {});
      } else {
        alert("Para transmitir la pestaña a tu Chromecast:\n\n1. En la ventana emergente de Chrome, selecciona 'Fuentes'.\n2. Elige 'Transmitir pestaña'.\n3. Selecciona tu TV ('Operaciones').");
      }
    }

    const URL_SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSa49x6GbEZX5y30fcBv3oueTcOC4AO9sIkj45reZXeNhTkMcsAXfmRA7nhdULkMNtT0DG4YMsH9Ow/pub?output=csv";

    function parseCSV(csvText) {
      const lines = csvText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 2) return [];
      
      const headers = lines[0].split(',').map(h => h.replace(/^"(.*)"$/, '$1').trim());
      const data = [];

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = row[idx] || '';
        });
        data.push(obj);
      }
      return data;
    }

    function getEmbedYouTubeUrl(url) {
      if (!url) return "https://www.youtube.com/embed/m5QLgqBA04M";
      let videoId = "";
      if (url.includes("v=")) {
        videoId = url.split("v=")[1].split("&")[0];
      } else if (url.includes("youtu.be/")) {
        videoId = url.split("youtu.be/")[1].split("?")[0];
      } else if (url.includes("embed/")) {
        return url;
      }
      return videoId ? `https://www.youtube.com/embed/${videoId}` : "https://www.youtube.com/embed/m5QLgqBA04M";
    }

    async function initTerminal() {
      let urlVideo = "https://www.youtube.com/watch?v=m5QLgqBA04M";
      let activosTicker = [];
      let simboloInicial = "NASDAQ:AAPL";

      try {
        const response = await fetch(URL_SHEET);
        if (!response.ok) throw new Error("Error en Google Sheets");
        const csvText = await response.text();
        const data = parseCSV(csvText);

        const filaVideo = data.find(item => item.tipo === 'video');
        if (filaVideo && filaVideo.valor) {
          urlVideo = filaVideo.valor;
        }

        for (let i = 1; i <= 10; i++) {
          const fila = data.find(item => item.tipo === `activo_${i}`);
          if (fila && fila.valor) {
            const ticker = fila.valor;
            const nombreCustom = (fila.nombre && fila.nombre.trim() !== '') 
              ? fila.nombre 
              : ticker.split(':').pop();
            activosTicker.push({ proName: ticker, title: nombreCustom });
          }
        }

        if (activosTicker.length > 0) {
          simboloInicial = activosTicker[0].proName;
        } else {
          activosTicker = [{ proName: "NASDAQ:AAPL", title: "AAPL" }];
        }

      } catch (err) {
        activosTicker = [{ proName: "NASDAQ:AAPL", title: "AAPL" }];
      }

      document.getElementById('youtube-frame').src = getEmbedYouTubeUrl(urlVideo);

      const tickerContainer = document.getElementById('ticker-container');
      const tickerScript = document.createElement('script');
      tickerScript.type = 'text/javascript';
      tickerScript.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
      tickerScript.async = true;
      tickerScript.text = JSON.stringify({
        "symbols": activosTicker,
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "displayMode": "adaptive",
        "locale": "es"
      });
      tickerContainer.appendChild(tickerScript);

      new TradingView.widget({
        "autosize": true,
        "symbol": simboloInicial,
        "interval": "D",
        "timezone": "America/Argentina/Buenos_Aires",
        "theme": "dark",
        "style": "1",
        "locale": "es",
        "toolbar_bg": "#000000",
        "allow_symbol_change": true,
        "container_id": "tradingview_chart"
      });
    }

    initTerminal();
  </script>
</body>
</html>
